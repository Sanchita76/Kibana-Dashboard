# OPTIONAL path: ingest data/sales.csv through Logstash instead of the Python loader.
# 1) python scripts/load_data.py  (creates mapping + sales.csv)   2) docker compose --profile ingest up logstash
input {
  file {
    path => "/usr/share/logstash/data_in/sales.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}
filter {
  csv {
    separator => ","
    skip_header => true
    columns => ["order_id","order_date","customer_id","country","city","category","product",
                "quantity","unit_price","discount_pct","total_amount","payment_method","status","rating"]
  }
  mutate {
    convert => {
      "quantity" => "integer"
      "unit_price" => "float"
      "discount_pct" => "integer"
      "total_amount" => "float"
      "rating" => "integer"
    }
  }
  date { match => ["order_date", "ISO8601"] target => "order_date" }
  mutate { remove_field => ["message", "@version", "event", "log", "host"] }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shop-sales"
    document_id => "%{order_id}"
    ilm_enabled => false
  }
  stdout { codec => dots }
}
